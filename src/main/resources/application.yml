spring:
  application:
    name: enterprise-iner-training
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200

# Knife4j 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.leo.enterpriseinertraining

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis-Flex
mybatis-flex:
  global-config:
    print-banner: false
    logic-delete-column: is_deleted
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.leo.enterpriseinertraining: DEBUG
    org.springframework.security: INFO

# 自定义 JWT 配置（被 JwtProperties 绑定）
app:
  jwt:
    # 强制环境变量注入（至少 32 字节）。本地：
    #   export JWT_SECRET=$(openssl rand -base64 48)
    # IDE Run Configuration → Environment variables 中加一条同名条目即可。
    # 未设置时 Spring 会以字面量 `${JWT_SECRET}` 注入，导致 Keys.hmacShaKeyFor 因长度不足抛错（fail-fast）。
    secret: ${JWT_SECRET:}
    expire-millis: 86400000          # 24h
    header: Authorization
    prefix: "Bearer "
  dashscope:
    embedding-model: text-embedding-v3
    embedding-url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    rerank-model: gte-rerank-v2
    rerank-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    chat-model: qwen-max

  # Query 改写 / 意图识别（阶段 5 LoRA 微调子模块）
  # 默认走 DashScope qwen-max；训练好 LoRA 后改 base-url 指向 vLLM：
  #   base-url: http://localhost:8000/v1
  #   model:    qwen2.5-1.5b-querywriter-lora
  query-rewriter:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-max
    temperature: 0.0
    timeout-millis: 8000