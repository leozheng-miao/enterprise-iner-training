name: multi_agent_v1
version: 2
nodes:
  - id: plan
    agent: Planner
    prompt: planner_prompt@active
    model: qwen-max
    next: [research]

  - id: research
    agent: Researcher
    prompt: researcher_prompt@active
    model: qwen-plus
    tools:
      - hybrid_search
    fanout:
      from: "${plan.subtopics}"
    join: all
    next: [analyze]

  - id: analyze
    agent: Analyst
    prompt: analyst_prompt@active
    model: qwen-max
    next: [write]

  - id: write
    agent: Writer
    prompt: writer_prompt@active
    model: qwen-plus
    fanout:
      from: "${analyze.sections}"
    join: all
    next: [critic]

  - id: critic
    agent: Critic
    prompt: critic_prompt@active
    model: qwen-max
    maxLoops: 1
    onNeedsRevision: write
