spring:
  ai:
    openai:
      # 通过环境变量注入，避免明文 key 进 git 历史。
      # 本地：export DASHSCOPE_API_KEY=sk-xxx；或加入 IDEA Run Configuration → Environment variables
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/irp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: irp
    password: irppw

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1

rocketmq:
  name-server: 127.0.0.1:9877
  producer:
    group: irp-producer-group
    send-message-timeout: 5000

# RAG 子系统配置
rag:
  pgvector:
    url: jdbc:postgresql://localhost:5434/irp_vec
    username: irp
    password: irppw
    schema: public
    table: knowledge_chunk_vec
    dimensions: 1024
  elasticsearch:
    host: localhost
    port: 9201
    scheme: http
    index: knowledge_chunk_bm25

# v2.0 多 Provider LLM 配置。4 者均走 OpenAI 协议，仅 base-url/model 不同。
# api-key 一律环境变量注入，禁止明文进 git。
app:
  llm:
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY:}
        model: qwen-max
        temperature: 0.7
      openai:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY:}
        model: gpt-4o
        temperature: 0.7
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        temperature: 0.7
      vllm:
        base-url: ${VLLM_BASE_URL:http://localhost:8000}
        api-key: ${VLLM_API_KEY:}
        model: ${VLLM_MODEL:qwen2.5-1.5b-instruct}
        temperature: 0.0