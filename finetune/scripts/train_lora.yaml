# LLaMA-Factory LoRA 训练配置。
#
# 用法：
#   pip install llamafactory
#   llamafactory-cli train finetune/scripts/train_lora.yaml
#
# 数据集走 finetune/scripts/dataset_info.json 注册的 query_rewriter。
# 算力建议 AutoDL 单卡 4090（显存约 14 GB），30-50 分钟 / 3 epoch。

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: query_rewriter
dataset_dir: finetune/scripts        # dataset_info.json 所在目录
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: finetune/output/qwen2.5-1.5b-querywriter-lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
